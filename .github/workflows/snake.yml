name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      # give the snake the README's dark panel so it reads dark on GitHub's light theme too
      - name: add dark panel behind snake.svg
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("dist/snake.svg")
          s = p.read_text()
          x, y, w, h = re.search(r'viewBox="([^"]+)"', s).group(1).split()
          panel = (f'<rect x="{float(x) + .5}" y="{float(y) + .5}" width="{float(w) - 1}" height="{float(h) - 1}" '
                   f'rx="15.5" fill="#0B0F17" stroke="#1E293B"/>')
          i = s.index(">", s.index("<svg")) + 1
          p.write_text(s[:i] + panel + s[i:])
          PY

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
