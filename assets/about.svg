<svg xmlns="http://www.w3.org/2000/svg" width="880" height="364" viewBox="0 0 880 364" role="img" aria-label="About — I build the screens where decisions get made." fill="none">
<title>About — I build the screens where decisions get made.</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient></defs>
<rect x=".5" y=".5" width="879" height="363" rx="15.5" fill="#0B0F17" stroke="#1E293B"/>

<path d="M16 0H864a16 16 0 0 1 16 16V40H0V16a16 16 0 0 1 16-16z" fill="#101725"/>
<circle cx="24" cy="20" r="6" fill="#FF5F57"/><circle cx="44" cy="20" r="6" fill="#FEBC2E"/><circle cx="64" cy="20" r="6" fill="#28C840"/>
<text x="440.0" y="24.5" text-anchor="middle" class="mono" font-size="12" fill="#8B97A8">~/profile/about.md — preview</text>
<line x1="0" y1="40.5" x2="880" y2="40.5" stroke="#1E293B"/>
<text x="28" y="84" class="sans up" style="animation-delay:.2s" font-size="24" font-weight="800" letter-spacing="-.4" fill="url(#brand)">I build the screens where decisions get made.</text>
<g class="up" style="animation-delay:0.50s"><rect x="28" y="105" width="3" height="67" rx="1.5" fill="#22D3EE"/><text x="42" y="120" class="mono" font-size="13" fill="#22D3EE">now</text><text x="128" y="120" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">Real-time financial dashboards at <tspan font-weight="700" fill="#E6EDF3">Octane</tspan>: transaction monitoring, risk</text><text x="128" y="143" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">assessment, analytics that update while you watch. A dropped frame or a mislabeled</text><text x="128" y="166" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">axis costs someone money, so I own both halves: the render path and the pixel.</text></g><g class="up" style="animation-delay:0.75s"><rect x="28" y="192" width="3" height="67" rx="1.5" fill="#A78BFA"/><text x="42" y="207" class="mono" font-size="13" fill="#A78BFA">before</text><text x="128" y="207" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">Full-stack at <tspan font-weight="700" fill="#E6EDF3">Everest Minds</tspan>, shipping process-automation tools and cross-</text><text x="128" y="230" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">platform healthcare apps with React, NestJS, Angular, React Native, MySQL and</text><text x="128" y="253" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">MongoDB. Features owned end to end, design through deploy.</text></g><g class="up" style="animation-delay:1.00s"><rect x="28" y="279" width="3" height="44" rx="1.5" fill="#34D399"/><text x="42" y="294" class="mono" font-size="13" fill="#34D399">origin</text><text x="128" y="294" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">Biomedical and telecom field ops: complex hardware, compliance, real consequences.</text><text x="128" y="317" class="sans" font-size="15" fill="#E6EDF3" fill-opacity=".86">That's where I learned most bugs are systems problems wearing a code costume.</text></g>
</svg>
