<svg xmlns="http://www.w3.org/2000/svg" width="448" height="260" viewBox="-8 0 448 260" role="img" aria-label="Mocklyst — a working mock API endpoint in under 30 seconds, with schema designer, status codes, latency and analytics" fill="none">
<title>Mocklyst — a working mock API endpoint in under 30 seconds, with schema designer, status codes, latency and analytics</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ln{animation:ln 4.5s ease infinite both}@keyframes ln{0%{opacity:0;transform:translateX(-6px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}.bar{transform-box:fill-box;transform-origin:left;animation:bar 4.5s cubic-bezier(.2,.7,.2,1) infinite}@keyframes bar{0%,15%{transform:scaleX(0)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient>
<clipPath id="pv"><rect x="20" y="78" width="400" height="124" rx="10"/></clipPath>
<linearGradient id="topline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="439" height="259" rx="15.5" fill="#0B0F17" stroke="#1E293B"/>
<rect x="16" y=".5" width="408" height="1.5" fill="url(#topline)"/>
<rect x="20" y="20" width="40" height="40" rx="10" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".35"/>
<text x="40" y="46" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#22D3EE">{}</text>
<text x="72" y="38" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">Mocklyst</text>
<text x="72" y="57" class="sans" font-size="12.5" fill="#8B97A8">Instant API mocking — no signup, no install</text>
<circle cx="381.2" cy="34" r="3.5" fill="#34D399"/>
<text x="420" y="38" text-anchor="end" class="mono" font-size="11" fill="#34D399">live</text>
<rect x="20.5" y="78.5" width="399" height="123" rx="10" fill="#101725" stroke="#1E293B"/>
<g clip-path="url(#pv)"><text x="34" y="102" class="mono ln" font-size="11.5" fill="#E6EDF3" style="animation-delay:0s"><tspan fill="#34D399">$</tspan> curl mocklyst.vercel.app/api/<tspan fill="#22D3EE">x7f2</tspan>/users</text><text x="34" y="126" class="mono ln" font-size="11.5" fill="#E6EDF3" style="animation-delay:0.7s"><tspan fill="#34D399">HTTP/1.1 200 OK</tspan>  <tspan fill="#4B5565">·</tspan>  <tspan fill="#FBBF24">latency 142ms</tspan></text><text x="34" y="150" class="mono ln" font-size="11.5" fill="#E6EDF3" style="animation-delay:1.2s"><tspan fill="#8B97A8">[{ </tspan><tspan fill="#22D3EE">"id"</tspan>: 1, <tspan fill="#22D3EE">"name"</tspan>: <tspan fill="#34D399">"Ada"</tspan>, <tspan fill="#22D3EE">"role"</tspan>: <tspan fill="#34D399">"admin"</tspan><tspan fill="#8B97A8"> }, …]</tspan></text><rect x="34" y="168" width="372" height="4" rx="2" fill="#0B0F17"/><rect x="34" y="168" width="372" height="4" rx="2" fill="#22D3EE" class="bar"/><text x="34" y="190" class="mono" font-size="10.5" fill="#8B97A8">endpoint live in &lt; 30s · expires in 7d</text></g>
<rect x="20.5" y="218.5" width="92" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="66.5" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Next.js 15</text><rect x="118.5" y="218.5" width="77" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="157.1" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">React 19</text><rect x="201.7" y="218.5" width="77" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="240.3" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Supabase</text><rect x="284.9" y="218.5" width="92" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="330.9" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Tailwind 4</text>
</svg>
