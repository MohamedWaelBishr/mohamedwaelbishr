<svg xmlns="http://www.w3.org/2000/svg" width="448" height="260" viewBox="0 0 448 260" role="img" aria-label="Raycast Prompt Enhancer — a Raycast extension that rewrites weak prompts with an LLM without leaving the launcher" fill="none">
<title>Raycast Prompt Enhancer — a Raycast extension that rewrites weak prompts with an LLM without leaving the launcher</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ln{animation:ln 4.5s ease infinite both}@keyframes ln{0%{opacity:0;transform:translateX(-6px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient>
<clipPath id="pv"><rect x="20" y="78" width="400" height="124" rx="10"/></clipPath>
<linearGradient id="topline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6363" stop-opacity="0"/><stop offset=".5" stop-color="#FF6363"/><stop offset="1" stop-color="#FF6363" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="439" height="259" rx="15.5" fill="#0B0F17" stroke="#1E293B"/>
<rect x="16" y=".5" width="408" height="1.5" fill="url(#topline)"/>
<rect x="20" y="20" width="40" height="40" rx="10" fill="#FF6363" fill-opacity=".14" stroke="#FF6363" stroke-opacity=".35"/>
<text x="40" y="46" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#FF6363">⌘</text>
<text x="72" y="38" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">Prompt Enhancer</text>
<text x="72" y="57" class="sans" font-size="12.5" fill="#8B97A8">Raycast: a lazy prompt in, a good one out</text>
<circle cx="330.8" cy="34" r="3.5" fill="#A78BFA"/>
<text x="420" y="38" text-anchor="end" class="mono" font-size="11" fill="#A78BFA">open source</text>
<rect x="20.5" y="78.5" width="399" height="123" rx="10" fill="#101725" stroke="#1E293B"/>
<g clip-path="url(#pv)">
<rect x="34" y="92" width="372" height="30" rx="8" fill="#0B0F17" stroke="#1E293B"/>
<text x="46" y="112" class="mono" font-size="11.5" fill="#4B5565">⌘␣</text>
<text x="78" y="112" class="mono" font-size="11.5" fill="#E6EDF3">fix my code pls<tspan fill="#F472B6" class="blink">▍</tspan></text>
<text x="394" y="112" text-anchor="end" class="mono" font-size="10.5" fill="#FF6363">enhance ↵</text>
<text x="38" y="144" class="mono ln" font-size="11" fill="#8B97A8" style="animation-delay:.6s"><tspan fill="#FF6363">→</tspan> Act as a senior TypeScript reviewer.</text>
<text x="38" y="162" class="mono ln" font-size="11" fill="#8B97A8" style="animation-delay:1.1s"><tspan fill="#FF6363">→</tspan> Find the bug, explain the root cause,</text>
<text x="38" y="180" class="mono ln" font-size="11" fill="#8B97A8" style="animation-delay:1.6s"><tspan fill="#FF6363">→</tspan> then propose a minimal diff + a test.</text></g>
<rect x="20.5" y="218.5" width="92" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="66.5" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">TypeScript</text><rect x="118.5" y="218.5" width="99" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="168.2" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Raycast API</text><rect x="223.9" y="218.5" width="40" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="244.0" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">LLM</text>
</svg>
