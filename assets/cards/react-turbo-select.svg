<text x="48" y="142" class="mono" font-size="11" fill="#E6EDF3">React</text><text x="194" y="142" text-anchor="end" class="mono" font-size="11" fill="#A78BFA">✓</text><text x="48" y="160" class="mono" font-size="11" fill="#E6EDF3">Next.js</text><text x="194" y="160" text-anchor="end" class="mono" font-size="11" fill="#A78BFA">✓</text><text x="48" y="178" class="mono" font-size="11" fill="#E6EDF3">Svelte</text><text x="194" y="178" text-anchor="end" class="mono" font-size="11" fill="#A78BFA">✓</text><text x="48" y="196" class="mono" font-size="11" fill="#E6EDF3">Vue</text><text x="194" y="196" text-anchor="end" class="mono" font-size="11" fill="#A78BFA"></text>
<text x="230" y="142" class="mono" font-size="10.5" fill="#8B97A8">single · multi · tags</text>
