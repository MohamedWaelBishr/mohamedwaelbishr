<svg xmlns="http://www.w3.org/2000/svg" width="448" height="260" viewBox="-8 0 448 260" role="img" aria-label="react-turbo-select — a flexible, themeable React select with single, multi and tag modes" fill="none">
<title>react-turbo-select — a flexible, themeable React select with single, multi and tag modes</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.chip{animation:chip 4.2s cubic-bezier(.3,1.4,.5,1) infinite both}@keyframes chip{0%{opacity:0;transform:translateY(4px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}.cur{animation:cur 4.2s steps(1) infinite}@keyframes cur{0%{transform:translateY(0)}14%{transform:translateY(0)}28%{transform:translateY(18px)}42%{transform:translateY(36px)}56%,100%{transform:translateY(54px)}}</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient>
<clipPath id="pv"><rect x="20" y="78" width="400" height="124" rx="10"/></clipPath>
<linearGradient id="topline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="439" height="259" rx="15.5" fill="#0B0F17" stroke="#1E293B"/>
<rect x="16" y=".5" width="408" height="1.5" fill="url(#topline)"/>
<rect x="20" y="20" width="40" height="40" rx="10" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".35"/>
<text x="40" y="46" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#A78BFA">▾</text>
<text x="72" y="38" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">react-turbo-select</text>
<text x="72" y="57" class="sans" font-size="12.5" fill="#8B97A8">The select I kept rewriting — so I shipped it</text>
<circle cx="330.8" cy="34" r="3.5" fill="#A78BFA"/>
<text x="420" y="38" text-anchor="end" class="mono" font-size="11" fill="#A78BFA">open source</text>
<rect x="20.5" y="78.5" width="399" height="123" rx="10" fill="#101725" stroke="#1E293B"/>
<g clip-path="url(#pv)">
