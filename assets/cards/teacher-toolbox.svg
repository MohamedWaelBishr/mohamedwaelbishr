<svg xmlns="http://www.w3.org/2000/svg" width="448" height="260" viewBox="0 0 448 260" role="img" aria-label="Teacher Toolbox — AI worksheet generator with drag-and-drop builder, KaTeX math and DOCX export" fill="none">
<title>Teacher Toolbox — AI worksheet generator with drag-and-drop builder, KaTeX math and DOCX export</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.drag{animation:drag 4s cubic-bezier(.3,.7,.2,1) infinite}@keyframes drag{0%{transform:translate(200px,-40px);opacity:0}15%{opacity:1}45%,85%{transform:none;opacity:1}100%{opacity:0}}.gen{transform-box:fill-box;transform-origin:left;animation:gen 4s ease infinite}@keyframes gen{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient>
<clipPath id="pv"><rect x="20" y="78" width="400" height="124" rx="10"/></clipPath>
<linearGradient id="topline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="439" height="259" rx="15.5" fill="#0B0F17" stroke="#1E293B"/>
<rect x="16" y=".5" width="408" height="1.5" fill="url(#topline)"/>
<rect x="20" y="20" width="40" height="40" rx="10" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".35"/>
<text x="40" y="46" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#34D399">∑</text>
<text x="72" y="38" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">Teacher Toolbox</text>
<text x="72" y="57" class="sans" font-size="12.5" fill="#8B97A8">AI-generated worksheets for classrooms</text>
<circle cx="381.2" cy="34" r="3.5" fill="#34D399"/>
<text x="420" y="38" text-anchor="end" class="mono" font-size="11" fill="#34D399">live</text>
<rect x="20.5" y="78.5" width="399" height="123" rx="10" fill="#101725" stroke="#1E293B"/>
<g clip-path="url(#pv)">
<rect x="34" y="90" width="210" height="140" rx="6" fill="#F8FAFC"/>
<text x="48" y="112" class="sans" font-size="11" font-weight="700" fill="#0F172A">Worksheet · Algebra I</text>
<text x="48" y="134" class="mono" font-size="11" fill="#334155">1.  2x + 6 = 14</text>
<text x="48" y="154" class="mono" font-size="11" fill="#334155">2.  ∫₀¹ x² dx = ⅓</text>
<rect x="48" y="164" width="180" height="22" rx="4" stroke="#94A3B8" stroke-dasharray="3 3"/>
<g class="drag"><rect x="50" y="166" width="176" height="18" rx="4" fill="#34D399" fill-opacity=".9"/>
<text x="58" y="179" class="mono" font-size="10.5" fill="#052E16">3.  multiple choice</text></g>
<text x="264" y="112" class="mono" font-size="10.5" fill="#8B97A8">AI · generate</text>
<rect x="264" y="122" width="140" height="6" rx="3" fill="#0B0F17"/><rect x="264" y="122" width="140" height="6" rx="3" fill="#34D399" class="gen"/>
<text x="264" y="156" class="mono" font-size="10.5" fill="#8B97A8">KaTeX ✓</text>
<text x="264" y="176" class="mono" font-size="10.5" fill="#8B97A8">drag &amp; drop ✓</text>
<text x="264" y="196" class="mono" font-size="10.5" fill="#34D399">export .docx ↓</text></g>
<rect x="20.5" y="218.5" width="70" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="55.4" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Next.js</text><rect x="96.30000000000001" y="218.5" width="62" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="127.5" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Strapi</text><rect x="164.70000000000002" y="218.5" width="122" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="225.5" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">TanStack Query</text><rect x="292.3" y="218.5" width="70" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="327.2" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">dnd-kit</text>
</svg>
