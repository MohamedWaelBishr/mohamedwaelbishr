<svg xmlns="http://www.w3.org/2000/svg" width="448" height="260" viewBox="0 0 448 260" role="img" aria-label="Teacher Toolbox — AI worksheet generator with drag-and-drop builder, KaTeX math and DOCX export" fill="none">
<title>Teacher Toolbox — AI worksheet generator with drag-and-drop builder, KaTeX math and DOCX export</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.drag{animation:drag 4s cubic-bezier(.3,.7,.2,1) infinite}@keyframes drag{0%{transform:translate(200px,-40px);opacity:0}15%{opacity:1}45%,85%{transform:none;opacity:1}100%{opacity:0}}.gen{transform-box:fill-box;transform-origin:left;animation:gen 4s ease infinite}@keyframes gen{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}</style>

