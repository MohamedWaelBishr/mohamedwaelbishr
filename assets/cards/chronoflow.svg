DF3">enrich</text><rect x="236" y="127" width="68" height="26" rx="7" fill="#0B0F17" stroke="#1E293B"/><rect x="236" y="127" width="68" height="26" rx="7" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" class="run" style="animation-delay:1.0s"/><text x="270" y="144" text-anchor="middle" class="mono" font-size="10.5" fill="#E6EDF3">approve</text><rect x="332" y="127" width="68" height="26" rx="7" fill="#0B0F17" stroke="#1E293B"/><rect x="332" y="127" width="68" height="26" rx="7" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" class="run" style="animation-delay:1.5s"/><text x="366" y="144" text-anchor="middle" class="mono" font-size="10.5" fill="#E6EDF3">audit</text><text x="34" y="192" class="mono" font-size="10.5" fill="#8B97A8"><tspan fill="#34D399">✓</tspan> run complete · audit trail sealed</text></g>
<rect x="20.5" y="218.5" width="92" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="66.5" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Next.js 15</text><rect x="118.5" y="218.5" width="85" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="160.8" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">NestJS 11</text><rect x="209.10000000000002" y="218.5" width="77" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="247.7" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Postgres</text><rect x="292.3" y="218.5" width="55" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="319.8" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Redis</text><rect x="353.3" y="218.5" width="62" height="22" rx="11" fill="#101725" stroke="#1E293B"/><text x="384.5" y="233.5" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">Docker</text>
