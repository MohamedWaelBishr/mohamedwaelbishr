<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Let's build something people actually use — mohamedwaelbishr@gmail.com" fill="none">
<title>Let's build something people actually use — mohamedwaelbishr@gmail.com</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient><clipPath id="c"><rect width="880" height="150" rx="16"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter></defs>
<g clip-path="url(#c)">
<rect width="880" height="150" fill="#0B0F17"/>
<circle cx="760" cy="150" r="120" fill="#A78BFA" fill-opacity=".14" filter="url(#blur)"/>
<circle cx="120" cy="0" r="110" fill="#22D3EE" fill-opacity=".12" filter="url(#blur)"/>
<text x="32" y="46" class="mono" font-size="14" fill="#E6EDF3"><tspan fill="#34D399">➜</tspan> <tspan fill="#22D3EE">~/profile</tspan> echo $NEXT</text>
<text x="32" y="88" class="sans up" style="animation-delay:.4s" font-size="26" font-weight="800" letter-spacing="-.5" fill="url(#brand)">Let's build something people actually use.</text>
<text x="32" y="122" class="mono fade" style="animation-delay:.9s" font-size="13" fill="#8B97A8">mohamedwaelbishr@gmail.com <tspan fill="#4B5565">·</tspan> process exited with code <tspan fill="#34D399">0</tspan> <tspan fill="#22D3EE" class="blink">▍</tspan></text>
</g>
<rect x=".5" y=".5" width="879" height="149" rx="15.5" stroke="#1E293B"/>
</svg>
