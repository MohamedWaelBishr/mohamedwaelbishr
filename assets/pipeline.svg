<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="How I ship: spec, design, build, test, ship, measure — then loop back" fill="none">
<title>How I ship: spec, design, build, test, ship, measure — then loop back</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.lit{opacity:0;animation:lit 7.2s ease-out infinite}
@keyframes lit{0%{opacity:0}6%{opacity:1}22%{opacity:0}100%{opacity:0}}
</style>

<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient></defs>
<rect x=".5" y=".5" width="879" height="249" rx="15.5" fill="#0B0F17" stroke="#1E293B"/>
<text x="20" y="32" class="mono" font-size="12" fill="#8B97A8"><tspan fill="#34D399">$</tspan> make ship <tspan fill="#4B5565"># how a feature moves through my hands</tspan></text>
<path d="M30 54H854" stroke="#1E293B" stroke-width="2"/>
<path d="M30 54H854" stroke="#22D3EE" stroke-opacity=".5" stroke-width="2" class="flow"/>

<g>
  <rect x="20.5" y="54.5" width="124" height="72" rx="12" fill="#101725" stroke="#1E293B"/>
  <rect x="20.5" y="54.5" width="124" height="72" rx="12" stroke="#22D3EE" stroke-width="1.5" class="lit" style="animation-delay:0.02s"/>
  <text x="36" y="84" class="mono" font-size="15" fill="#22D3EE">◇</text>
  <text x="36" y="110" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">spec</text>
  <text x="132" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#4B5565">01</text>
  <text x="82.5" y="152" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">read the real problem</text>
</g>
<g>
  <rect x="164.5" y="54.5" width="124" height="72" rx="12" fill="#101725" stroke="#1E293B"/>
  <rect x="164.5" y="54.5" width="124" height="72" rx="12" stroke="#22D3EE" stroke-width="1.5" class="lit" style="animation-delay:1.22s"/>
  <text x="180" y="84" class="mono" font-size="15" fill="#22D3EE">✎</text>
  <text x="180" y="110" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">design</text>
  <text x="276" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#4B5565">02</text>
  <text x="226.5" y="152" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">figma → tokens</text>
</g>
<g>
  <rect x="308.5" y="54.5" width="124" height="72" rx="12" fill="#101725" stroke="#1E293B"/>
  <rect x="308.5" y="54.5" width="124" height="72" rx="12" stroke="#22D3EE" stroke-width="1.5" class="lit" style="animation-delay:2.42s"/>
  <text x="324" y="84" class="mono" font-size="15" fill="#22D3EE">&lt;/&gt;</text>
  <text x="324" y="110" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">build</text>
  <text x="420" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#4B5565">03</text>
  <text x="370.5" y="152" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">typed end to end</text>
</g>
<g>
  <rect x="452.5" y="54.5" width="124" height="72" rx="12" fill="#101725" stroke="#1E293B"/>
  <rect x="452.5" y="54.5" width="124" height="72" rx="12" stroke="#22D3EE" stroke-width="1.5" class="lit" style="animation-delay:3.62s"/>
  <text x="468" y="84" class="mono" font-size="15" fill="#22D3EE">✓</text>
  <text x="468" y="110" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">test</text>
  <text x="564" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#4B5565">04</text>
  <text x="514.5" y="152" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">unit · e2e · a11y</text>
</g>
<g>
  <rect x="596.5" y="54.5" width="124" height="72" rx="12" fill="#101725" stroke="#1E293B"/>
  <rect x="596.5" y="54.5" width="124" height="72" rx="12" stroke="#22D3EE" stroke-width="1.5" class="lit" style="animation-delay:4.82s"/>
  <text x="612" y="84" class="mono" font-size="15" fill="#22D3EE">▲</text>
  <text x="612" y="110" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">ship</text>
  <text x="708" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#4B5565">05</text>
  <text x="658.5" y="152" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">ci/cd → prod</text>
</g>
<g>
  <rect x="740.5" y="54.5" width="124" height="72" rx="12" fill="#101725" stroke="#1E293B"/>
  <rect x="740.5" y="54.5" width="124" height="72" rx="12" stroke="#22D3EE" stroke-width="1.5" class="lit" style="animation-delay:6.02s"/>
  <text x="756" y="84" class="mono" font-size="15" fill="#22D3EE">∿</text>
  <text x="756" y="110" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">measure</text>
  <text x="852" y="84" text-anchor="end" class="mono" font-size="10.5" fill="#4B5565">06</text>
  <text x="802.5" y="152" text-anchor="middle" class="mono" font-size="11" fill="#8B97A8">telemetry → iterate</text>
</g>
<path d="M824 166C824 206 60 206 60 166" stroke="#A78BFA" stroke-opacity=".55" stroke-width="1.5" class="flow" style="animation-direction:reverse"/>
<text x="440.0" y="236" text-anchor="middle" class="mono" font-size="11" fill="#A78BFA">↺ feedback loop — measure, then make it beautiful</text>
<circle r="5" fill="#22D3EE"><animateMotion path="M30 54H854" dur="7.2s" repeatCount="indefinite"/></circle>
<circle r="11" fill="#22D3EE" fill-opacity=".2"><animateMotion path="M30 54H854" dur="7.2s" repeatCount="indefinite"/></circle>
</svg>
