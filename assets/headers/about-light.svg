<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-label="01 — About" fill="none">
<title>01 — About</title>
<style>
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'JetBrains Mono',Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.scan{animation:scan 5s cubic-bezier(.6,0,.4,1) infinite;transform-box:view-box}
@keyframes scan{from{transform:translateX(-240px)}to{transform:translateX(900px)}}
</style>

<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2" stop-opacity="0"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient></defs>
<text x="0" y="38" class="mono" font-size="14" font-weight="700" fill="#0891B2">01</text>
<text x="32" y="38" class="mono" font-size="14" fill="#59636E">/</text>
<text x="48" y="39" class="sans" font-size="25" font-weight="800" letter-spacing="-.4" fill="#1F2328">About</text>
<text x="880" y="38" text-anchor="end" class="mono" font-size="13" fill="#59636E">~/about.md</text>
<rect x="0" y="54" width="880" height="1" fill="#D1D9E0"/>
<rect x="0" y="53.5" width="200" height="2" rx="1" fill="url(#g)" class="scan"/>
</svg>
